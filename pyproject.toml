[project]
name = "bone-marrow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "biopython>=1.80",
    "cellxgene-census>=1.18.0",
    "click>=8.4.2",
    "cupy-cuda12x",
    # Native shared libs for cuml wheels (libcuml++.so). Keep explicit so uv cannot
    # drop them when resolving rapids-singlecell[rapids12] extras.
    "libcuml-cu12==25.04.*",
    "cuml-cu12==25.04.*",
    "cudf-cu12==25.04.*",
    "dask[distributed]>=2024.1.0",
    "geoparse>=2.0.4",
    "gseapy>=1.1",
    "lightning>=2.0,<3",
    "matplotlib>=3.7",
    "numpy>=1.23,<2.0",
    "nvidia-cuda-nvrtc-cu12>=12.1,<13",
    "nvidia-cuda-runtime-cu12>=12.1,<13",
    "pandas>=1.5,<3",
    "py-scmetabolism",
    "python-pptx",
    "rapids-singlecell[rapids12]==0.13.0",
    "requests>=2.32.3",
    "requests-cache>=1.2.1",
    "ruff",
    "scanpy>=1.10.0,<1.12",
    "sccellfie",
    "scDataset",
    "scipy>=1.13,<2",
    "scverse-misc>=0.0.3",
    "scvi-tools==1.3.3",
    "torch==2.1.2+cu121",
    "torch-geometric>=2.7.0",
    "torchmetrics>=0.11",
    "zarr>=2.16,<3",
    "phlowerpy==0.1.5",
    "colorir>=2.0",
    "doubletdetection>=4.3",
    "leidenalg>=0.10",
    "scgen",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
scgen = { git = "https://github.com/LouiseDck/scgen", rev = "c19f00c7915fdc537ced678a32a39a8580492e0d" }
